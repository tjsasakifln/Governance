# Fixture wrapper for `nginx -t` against the shipped ops/auth templates.
# Not a host nginx config. Not applied. Not reloaded. Does not touch Warmbly.

worker_processes 1;
error_log /tmp/cc-nginx-error.log;
pid /tmp/cc-nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    include /etc/nginx/fragments/00-rate-limit-zones.conf;
    include /etc/nginx/conf.d/ops.confenge.com.br.conf;
    include /etc/nginx/conf.d/auth.ops.confenge.com.br.conf;
}
