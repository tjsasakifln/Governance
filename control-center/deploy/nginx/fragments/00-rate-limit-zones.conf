# Rate-limit zones for Control Center production-edge vhosts.
# Include from http {} before the ops/auth server blocks.
# Identity is never taken from X-Forwarded-For.

limit_req_zone $binary_remote_addr zone=cc_ops_edge:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cc_auth_login:10m rate=5r/m;
