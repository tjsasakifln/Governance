# auth.ops.confenge.com.br — TLS vhost for the Authelia portal.
# Proxies to loopback Caddy (127.0.0.1:18080). Rate-limits login.
# Does not alter Warmbly or api.confenge.com.br.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auth.ops.confenge.com.br;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/auth.ops.confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.ops.confenge.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Do not enable real_ip / set_real_ip_from on this vhost for Control Center identity.

    location / {
        limit_req zone=cc_auth_login burst=8 nodelay;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Email "";
    }
}
