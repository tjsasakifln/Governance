# ops.confenge.com.br — port-80 vhost. Host nginx owns 80 and ACME.
# Serves HTTP-01 challenges from /var/www/acme and 301s everything else to HTTPS.
# Does not proxy. Does not alter Warmbly or api.confenge.com.br.

server {
    listen 80;
    listen [::]:80;
    server_name ops.confenge.com.br;
    server_tokens off;
    client_max_body_size 1m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
