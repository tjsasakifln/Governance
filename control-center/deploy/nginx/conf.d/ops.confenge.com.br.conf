# ops.confenge.com.br — TLS vhost. Host nginx owns 80/443 and ACME.
# Proxies to loopback Caddy (127.0.0.1:18080). Does not alter Warmbly or api.confenge.com.br.
# Inbound Remote-* identity headers are stripped. X-Forwarded-For is not identity.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ops.confenge.com.br;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/ops.confenge.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ops.confenge.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Do not enable real_ip / set_real_ip_from on this vhost for Control Center identity.
    # X-Forwarded-For is forwarded for logs only and is not an authentication source.

    location / {
        limit_req zone=cc_ops_edge burst=40 nodelay;

        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";

        # Strip client-supplied identity. Authelia is the only writer of these headers.
        proxy_set_header Remote-User "";
        proxy_set_header Remote-Groups "";
        proxy_set_header Remote-Name "";
        proxy_set_header Remote-Email "";
    }
}
