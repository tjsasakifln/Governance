# Confenge Control Center — reference Compose pack for a Linux VPS (Netcup).
# Project: confenge-control-center
# This file does NOT apply itself to production. Do not bind host 80/443:
# Warmbly continues to use the existing host nginx on those ports.
# Runtime: context, mcp, collector, web, postgres, authelia, caddy gateway.
# No Kubernetes. No Swarm. No production apply from this wave.

name: confenge-control-center

x-logging: &cc-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-base: &app-base
  restart: unless-stopped
  logging: *cc-logging
  mem_limit: 512m
  cpus: 0.75
  read_only: true
  tmpfs:
    - /tmp:size=64M,mode=1777
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 512M
      reservations:
        cpus: "0.10"
        memory: 64M
  networks:
    - ccnet
  expose:
    - "8080"
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
    image: confenge-control-center-postgres:16
    restart: unless-stopped
    logging: *cc-logging
    mem_limit: 1g
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-control_center}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set from a secret store}"
      POSTGRES_DB: "${POSTGRES_DB:-control_center}"
      TZ: UTC
      PGTZ: UTC
    volumes:
      - cc_postgres_data:/var/lib/postgresql/data
    networks:
      - ccnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - postgres
      - -c
      - listen_addresses=*
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
    security_opt:
      - no-new-privileges:true

  context:
    <<: *app-base
    build:
      context: ..
      dockerfile: services/context/Dockerfile
    image: confenge-control-center-context:local
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_ENV: production
      CC_RELEASE_SHA: "${CC_RELEASE_SHA:-local}"
      DATABASE_URL: "${CONTROL_CENTER_DATABASE_URL:-postgres://control_center@postgres:5432/control_center}"
      CONTROL_CENTER_FOUNDER_ACTOR_ID: "${CONTROL_CENTER_FOUNDER_ACTOR_ID:?CONTROL_CENTER_FOUNDER_ACTOR_ID must be set}"
      CONTROL_CENTER_ENV: production
    healthcheck:
      test: ["CMD", "node", "/app/node-http-probe.mjs", "http://127.0.0.1:8080", "/healthz", "/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    <<: *app-base
    build:
      context: ..
      dockerfile: services/mcp/Dockerfile
    image: confenge-control-center-mcp:local
    environment:
      HOST: 0.0.0.0
      CONFENGE_MCP_HTTP_HOST: 0.0.0.0
      CONFENGE_MCP_HTTP_PORT: "8080"
      NODE_ENV: production
      CONTROL_CENTER_CONTEXT_URL: "http://context:8080"
      CONFENGE_MCP_AUTH_TOKEN: "${CONFENGE_MCP_AUTH_TOKEN:?CONFENGE_MCP_AUTH_TOKEN must be set from a secret store}"
    healthcheck:
      test: ["CMD", "node", "/app/node-http-probe.mjs", "http://127.0.0.1:8080", "/healthz", "/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 12s
    depends_on:
      context:
        condition: service_healthy

  collector:
    <<: *app-base
    build:
      context: ..
      dockerfile: connectors/runner/Dockerfile
    image: confenge-control-center-collector:local
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "node", "/app/node-http-probe.mjs", "http://127.0.0.1:8080", "/healthz", "/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 12s
    depends_on:
      postgres:
        condition: service_healthy
      context:
        condition: service_healthy

  web:
    <<: *app-base
    build:
      context: ..
      dockerfile: apps/web-shell/Dockerfile
    image: confenge-control-center-web:local
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      CC_RELEASE_SHA: "${CC_RELEASE_SHA:-local}"
      CONTROL_CENTER_ENV: production
    healthcheck:
      test: ["CMD", "node", "/app/node-http-probe.mjs", "http://127.0.0.1:8080", "/healthz", "/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 8s
    depends_on:
      context:
        condition: service_healthy

  authelia:
    image: authelia/authelia:4.39@sha256:1b363e9279e742397966333f364e0876ae02bf5c876de73e83af6d48c57ff51b
    restart: unless-stopped
    logging: *cc-logging
    mem_limit: 256m
    cpus: 0.50
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 32M
    expose:
      - "9091"
    volumes:
      - ../security/examples/valid/authelia:/config:ro
    networks:
      - ccnet
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9091/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  caddy:
    build:
      context: .
      dockerfile: docker/caddy.Dockerfile
    image: confenge-control-center-caddy:local
    restart: unless-stopped
    logging: *cc-logging
    mem_limit: 128m
    cpus: 0.50
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    environment:
      CONTROL_CENTER_PUBLIC_HOST: "${CONTROL_CENTER_PUBLIC_HOST:-cc.internal.confenge.local}"
      CONTROL_CENTER_CADDY_HTTP_PORT: "${CONTROL_CENTER_CADDY_HTTP_PORT:-18080}"
      CONTROL_CENTER_CADDY_HTTPS_PORT: "${CONTROL_CENTER_CADDY_HTTPS_PORT:-18443}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - cc_caddy_data:/data
      - cc_caddy_config:/config
    ports:
      - target: 18080
        published: "${CONTROL_CENTER_CADDY_HTTP_PORT:-18080}"
        protocol: tcp
        host_ip: "127.0.0.1"
      - target: 18443
        published: "${CONTROL_CENTER_CADDY_HTTPS_PORT:-18443}"
        protocol: tcp
        host_ip: "127.0.0.1"
    networks:
      - ccnet
    depends_on:
      context:
        condition: service_healthy
      mcp:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18080/healthz && wget -qO- http://127.0.0.1:18080/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  backup-ops:
    profiles: ["ops"]
    build:
      context: .
      dockerfile: docker/ops.Dockerfile
    image: confenge-control-center-ops:local
    restart: "no"
    logging: *cc-logging
    mem_limit: 256m
    cpus: 0.50
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.10"
          memory: 64M
    environment:
      CONTROL_CENTER_BACKUP_KEY: "${CONTROL_CENTER_BACKUP_KEY:?CONTROL_CENTER_BACKUP_KEY must be set from a secret store}"
      CONTROL_CENTER_BACKUP_DIR: /backups
      CONTROL_CENTER_BACKUP_RETAIN_DAYS: "${CONTROL_CENTER_BACKUP_RETAIN_DAYS:-14}"
      CONTROL_CENTER_BACKUP_RETAIN_MIN: "${CONTROL_CENTER_BACKUP_RETAIN_MIN:-3}"
      CONTROL_CENTER_DISK_MIN_BYTES: "${CONTROL_CENTER_DISK_MIN_BYTES:-1073741824}"
      CONTROL_CENTER_DISK_PATH: /backups
      CONTROL_CENTER_DATABASE_URL: "${CONTROL_CENTER_DATABASE_URL:-postgres://control_center@postgres:5432/control_center}"
    volumes:
      - cc_backup_data:/backups
    networks:
      - ccnet
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  cc_postgres_data:
    name: confenge-control-center-postgres
  cc_caddy_data:
    name: confenge-control-center-caddy-data
  cc_caddy_config:
    name: confenge-control-center-caddy-config
  cc_backup_data:
    name: confenge-control-center-backups

networks:
  ccnet:
    name: confenge-control-center
    driver: bridge
