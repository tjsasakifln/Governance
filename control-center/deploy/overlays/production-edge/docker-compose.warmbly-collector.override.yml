# OPTIONAL override. Not part of the default production-edge apply.
# Grants collector access to an external Warmbly Docker network only.
# Keeps cc_internal so the collector ledger can reach PostgreSQL.
# Does NOT attach collector to datastore volumes.
# Does NOT publish collector. Does NOT share postgres/redis/nats volumes.

services:
  collector:
    networks:
      cc_edge:
        ipv4_address: 10.89.0.7
      cc_internal: {}
      warmbly_net: {}

networks:
  warmbly_net:
    external: true
    name: ${WARMBLY_DOCKER_NETWORK:-warmbly}
