# Bounded HTTP-01 bootstrap. Disabled on install and removed after issuance.
# It serves only ACME tokens; every other request is an explicit 503.
server {
    listen 80;
    server_name confenge.com.br www.confenge.com.br;
    server_tokens off;

    access_log /var/log/confenge-web/acme.access.log;
    error_log  /var/log/confenge-web/acme.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        add_header Retry-After 300 always;
        return 503;
    }
}
