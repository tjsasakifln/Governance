worker_processes 1;
error_log /tmp/confenge-edge-nginx-error.log;
pid /tmp/confenge-edge-nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    include /etc/nginx/conf.d/confenge.com.br.conf;
}
